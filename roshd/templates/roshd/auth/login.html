{% extends "roshd/base.html" %}

{% block title %}ورود به رشد{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: auto;">
    <h2 style="text-align: center;">ورود</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>نام کاربری</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>رمز عبور</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">ورود</button>
    </form>
    <p style="text-align: center; margin-top: 1rem;">
        هنوز ثبت‌نام نکرده‌اید؟ <a href="{% url 'web-register' %}">ثبت‌نام</a>
    </p>
</div>
{% endblock %}
