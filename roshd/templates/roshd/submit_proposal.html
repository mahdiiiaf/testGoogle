{% extends "roshd/base.html" %}

{% block title %}ارسال پیشنهاد برای {{ job.title }} | رشد{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: auto;">
    <h2>ارسال پیشنهاد برای: {{ job.title }}</h2>
    <p>بودجه مشتری: {{ job.budget }} دلار</p>
    <hr>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>نامه توضیحی (Cover Letter)</label>
            <textarea name="cover_letter" rows="6" required placeholder="چرا شما برای این کار مناسب هستید؟"></textarea>
        </div>
        <div class="form-group">
            <label>مبلغ پیشنهادی شما (دلار)</label>
            <input type="number" name="bid_amount" step="0.01" required>
        </div>
        <button type="submit" class="btn">ارسال پیشنهاد</button>
        <a href="{% url 'web-job-detail' job.pk %}" style="margin-right: 15px;">انصراف</a>
    </form>
</div>
{% endblock %}
